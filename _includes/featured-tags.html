{% comment %}
    @param {boolean} bottom - bottom will render <hr> 
{% endcomment %}

{% if site.featured-tags %}
<section class="sidebar-card featured-tags-card">
    {% if include.bottom %}
        <hr class="hidden-sm hidden-xs">
    {% endif %}
    <h5><a href="{{'/archive/' | prepend: site.baseurl }}">FEATURED TAGS</a></h5>
    <div class="tags sidebar-tag-cloud" id="featured-tag-cloud">
        {% for tag in site.tags %}{% if tag[1].size > site.featured-condition-size %}
        <a href="{{ site.baseurl }}/archive/?tag={{ tag[0] | url_encode }}"
            title="{{ tag[0] }}"
            rel="{{ tag[1].size }}">{{ tag[0] }}<span class="tag-count">({{ tag[1].size }})</span></a>
        {% endif %}{% endfor %}
    </div>
</section>
<script>
(function() {
  var cloud = document.getElementById('featured-tag-cloud');
  if (!cloud) return;
  var links = Array.prototype.slice.call(cloud.querySelectorAll('a'));
  links.sort(function(a, b) {
    return parseInt(b.getAttribute('rel'), 10) - parseInt(a.getAttribute('rel'), 10);
  });
  links.forEach(function(link) { cloud.appendChild(link); });
})();
</script>
{% endif %}
